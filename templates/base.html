<!doctype html>
<html lang="pt-BR"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}LabelPrinter (ACT - Soluções para Pessoas){% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('main.index') }}">LabelPrinter <span>(ACT - Soluções para Pessoas)</span></a></div></nav>
<main class="container py-3 py-md-4">
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }} mb-3">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body></html>
